  /* CSPRNG helper: crypto-secure uniform [0,1). Drop-in for Math.random().
     Uses the Web Crypto API (crypto.getRandomValues) so every spin, draw and
     shuffle on this page is backed by a cryptographically secure random source.
     Falls back to Math.random() only if Web Crypto is unavailable. */
  function cryptoRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] / 4294967296; /* 2^32 -> uniform [0,1) */
    }
    return Math.random();
  }

<script>var canvas = document.getElementById('wheel');
    var ctx = canvas.getContext('2d');
    var colors = ['#db2777','#7c3aed','#2563eb','#059669','#d97706','#dc2626','#0891b2','#65a30d'];
    var RESULT_PREFIX = "Answer: ";
    var RESULT_INIT = "Spin to answer yes or no";
    var options = [];
    var currentAngle = 0;
    var spinning = false;
    var historyCount = 0;
    var winnerIdx = null;

    /* 与主页面一致：编号保持时间序（1=最早），最新一条置顶并高亮 */
    function addHistory(name, colorIdx) {
      historyCount++;
      var box = document.getElementById('history');
      var prev = box.querySelector('.chip.latest');
      if (prev) prev.classList.remove('latest');
      var chip = document.createElement('div');
      chip.className = 'chip latest';
      var ink = chipInk(colors[colorIdx % colors.length]);
      chip.style.setProperty('--chipc', ink.bg);
      chip.style.setProperty('--chipink', ink.fg);
      chip.title = name;
      chip.textContent = historyCount + '. ' + name;
      box.insertBefore(chip, box.firstChild);
    }

    /* 气泡配色：中间调颜色（如 #059669）配白配深都不到 AA 4.5。
       先在白 / 深之间择优，再按需把底色压暗或提亮，保持色相不变 —— 与主页面同一套算法 */
    function _srgb(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    function _lum(c) { return 0.2126 * _srgb(c[0]) + 0.7152 * _srgb(c[1]) + 0.0722 * _srgb(c[2]); }
    function _contrast(a, b) {
      var x = _lum(a), y = _lum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }
    function _hex(c) {
      return '#' + c.map(function (v) {
        var h = Math.round(Math.max(0, Math.min(255, v))).toString(16);
        return h.length === 1 ? '0' + h : h;
      }).join('');
    }
    function chipInk(hex) {
      var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
      if (!m) return { bg: hex || '#64748b', fg: '#ffffff' };
      var bg = [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
      var white = [255, 255, 255], dark = [30, 41, 59];
      var useWhite = _contrast(bg, white) >= _contrast(bg, dark);
      var ink = useWhite ? white : dark;
      for (var k = 0; k < 16 && _contrast(bg, ink) < 4.5; k++) {
        for (var i = 0; i < 3; i++) {
          bg[i] = useWhite ? bg[i] * 0.9 : bg[i] + (255 - bg[i]) * 0.18;
        }
      }
      return { bg: _hex(bg), fg: _hex(ink) };
    }

    function getOptions() {
      var raw = document.getElementById('options').value;
      return raw.split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    }

    function drawWheel(angle) {
      var n = options.length;
      var cw = canvas.width, ch = canvas.height;
      /* 与主页面同一套尺寸关系：外圈占 9px，扇形退到 rr，留出指针空间 */
      var cx = cw / 2, cy = ch / 2, r = Math.min(cx, cy) - 24; var rr = r - 7.5;
      ctx.clearRect(0, 0, cw, ch);
      if (n === 0) {
        ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#64748b'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Add options to spin', cx, cy);
        return;
      }
      var slice = (Math.PI * 2) / n;
      for (var i = 0; i < n; i++) {
        var start = angle + i * slice;
        var end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, rr, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        var label = options[i];
        if (label.length > 14) label = label.slice(0, 13) + '…';
        ctx.fillText(label, rr - 14, 5);
        ctx.restore();
      }
      /* 中奖扇区描边：红→黄→蓝渐变，与主页面一致；只描外弧，避免从圆心射出两道辐条 */
      if (winnerIdx !== null && winnerIdx < n) {
        var wStart = angle + winnerIdx * slice;
        var wEnd = wStart + slice;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, wStart, wEnd);
        var g = ctx.createLinearGradient(cx + Math.cos(wStart) * rr, cy + Math.sin(wStart) * rr, cx + Math.cos(wEnd) * rr, cy + Math.sin(wEnd) * rr);
        g.addColorStop(0, '#ef4444'); g.addColorStop(0.5, '#facc15'); g.addColorStop(1, '#3b82f6');
        ctx.strokeStyle = g; ctx.lineWidth = 4;
        ctx.stroke();

      /* 外圈色环 + 中心轴：改用与主页面相同的 conic 渐变，并在 1.0 回填首色闭合成环 */
      var T = Math.PI * 2;
      var RIM = ['#f43f5e','#f97316','#facc15','#22c55e','#3b82f6','#a855f7'];
      var ringGrad = null, hubGrad = null;
      if (ctx.createConicGradient) {
        ringGrad = ctx.createConicGradient(angle, cx, cy);
        hubGrad = ctx.createConicGradient(angle + Math.PI / 6, cx, cy);
        for (var gi = 0; gi < RIM.length; gi++) {
          var gstop = gi / RIM.length;
          ringGrad.addColorStop(gstop, RIM[gi]);
          hubGrad.addColorStop(gstop, RIM[gi]);
        }
        ringGrad.addColorStop(1, RIM[0]);
        hubGrad.addColorStop(1, RIM[0]);
      }
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, T);
      ctx.strokeStyle = ringGrad || RIM[0];
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 24, 0, T);
      ctx.fillStyle = hubGrad || RIM[0];
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, T);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      /* 指针不再是画在 12 点的三角：与主页面一致，指针就是中心 SPIN 按钮上方的尖角 */
    }

    function pickWinner() {
      /* 指针在 12 点方向，判定角度随之改为 Math.PI * 1.5（与主页面一致） */
      var n = options.length;
      var slice = (Math.PI * 2) / n;
      var a = ((currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      var idx = Math.floor((((Math.PI * 1.5 - a) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / slice) % n;
      return idx;
    }

    function animate(total, duration) {
      if (!spinning) return;
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        var angle = currentAngle + total * eased;
        drawWheel(angle);
        var _n = options.length;
        if (_n > 0) {
          var _slice = (Math.PI * 2) / _n;
          var _a = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          var _idx = Math.floor((((Math.PI * 1.5 - _a) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / _slice) % _n;
          if (_idx !== lastTickIdx) { lastTickIdx = _idx; tick(); }

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          currentAngle = (currentAngle + total) % (Math.PI * 2);
          var idx = pickWinner();
          winnerIdx = idx;
          drawWheel(currentAngle);
          document.getElementById('result').textContent = RESULT_PREFIX + options[idx];
          addHistory(options[idx], idx);
          document.getElementById('meta').textContent = options.length + ' options on the wheel.';
          spinning = false;
          setBtnsDisabled(false);
          track('spin', { options: options.length, winner: options[idx] });
        }
      }
      requestAnimationFrame(step);
    }

    function buildAndSpin() {
      lastTickIdx = -1; ensureAudio();
      options = getOptions();
      if (options.length === 0) { document.getElementById('meta').textContent = 'Please add at least one option.'; return; }
      if (spinning) return;
      spinning = true;
      winnerIdx = null;
      setBtnsDisabled(true);
      document.getElementById('result').textContent = 'Spinning…';
      drawWheel(currentAngle);
      var spins = 5 + Math.floor(cryptoRandom() * 3);
      var total = spins * Math.PI * 2 + cryptoRandom() * Math.PI * 2;
      animate(total, 3000);
    }

    function removeWinner() {
      var idx = pickWinner();
      if (options.length > 0) {
        var removed = options.splice(idx, 1);
        winnerIdx = null;
        document.getElementById('options').value = options.join('\n');
        document.getElementById('result').textContent = 'Removed: ' + removed[0];
        drawWheel(currentAngle);
        document.getElementById('meta').textContent = options.length + ' options left.';
      }
    }

    /* ---------- sound (5.3) ---------- */
    var audioCtx = null, muted = false, lastTickIdx = -1;

      try { muted = localStorage.getItem('myspinpick.yesNoWheel.sound') === 'off'; } catch (e) {}
      var b = document.getElementById('muteBtn');
      if (b) b.textContent = muted ? '🔇' : '🔊';
    }

    function setBtnsDisabled(d) {
      var b = document.querySelectorAll('.btns button');
      for (var i = 0; i < b.length; i++) { b[i].disabled = d; }
      var cs = document.getElementById('centerSpin');
      if (cs) cs.disabled = d;
    }

    /* 中心按钮尺寸跟着轮盘的实际显示直径走（iframe 宽度变化时要重算） */
    function fitCenter() {
      var box = document.querySelector('.wheel-box'), c = document.getElementById('wheel');
      if (box && c) box.style.setProperty('--wheel', c.getBoundingClientRect().width + 'px');
    }
    window.addEventListener('resize', fitCenter);

    function resetAll() {
      document.getElementById('options').value = 'Yes,No,Maybe,Try later';
      options = getOptions();
      currentAngle = 0;
      spinning = false;
      setBtnsDisabled(false);
      document.getElementById('result').textContent = RESULT_INIT;
      document.getElementById('meta').textContent = options.length + ' options on the wheel.';
      document.getElementById('history').innerHTML = '';
      historyCount = 0;
      winnerIdx = null;
      drawWheel(0);
    }

    document.getElementById('options').addEventListener('input', function() {
      options = getOptions();
      drawWheel(currentAngle);
    });

    options = getOptions();
    if (options.length) { document.getElementById('meta').textContent = options.length + ' options on the wheel.'; }
    drawWheel(0);
  fitCenter();
  initSound();</script>
</body>
</html>
