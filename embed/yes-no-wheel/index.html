<style>
    :root {
      --bg: #f6f8fb; --card: #ffffff; --ink: #1a202c; --muted: #64748b;
      --accent: #db2777; --accent-dark: #be185d; --border: #e2e8f0; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    header { padding: 18px 0 6px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap; }
.topbar h1 { flex: 1 1 auto; min-width: 0; }
    .topright { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-mini { display: inline-flex; align-items: center; gap: 0; font-weight: 700; font-size: 14px; color: var(--accent); text-decoration: none; }
    .brand-mini > svg { margin-right: 5px; }
    h1 { font-size: 24px; line-height: 1.25; letter-spacing: -0.02em; word-break: break-word; overflow-wrap: anywhere; }
    .sub { color: var(--muted); margin-top: 8px; font-size: 16px; }
    

    input[type="range"], input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
    .tool { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
    .wheel-wrap { text-align: center; margin-bottom: 16px; }
    canvas { max-width: 100%; }
    textarea { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; color: var(--ink); }
    input[type="text"] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; color: var(--ink); }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0; }
    button { border: 1px solid #93c5fd; background: #dbeafe; color: #1e40af; padding: 9px 16px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
    button:hover { background: #bfdbfe; border-color: #60a5fa; }
    button:disabled { background: #eff6ff; border-color: #dbeafe; color: #93c5fd; cursor: not-allowed; }
    .meta { font-size: 14px; color: var(--muted); margin-bottom: 8px; text-align: center; }
    .result { font-size: 18px; font-weight: 700; text-align: center; color: var(--accent); min-height: 28px; margin-top: 4px; }
    .history { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
    .history:empty { display: none; }
    .history .chip { color: #fff; border-radius: 8px; padding: 6px 4px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
    section { margin-top: 26px; }
    h2 { font-size: 20px; letter-spacing: -0.01em; margin-bottom: 10px; }
    section p, section li { color: #334155; font-size: 15px; }
    ul, ol { padding-left: 20px; }
    .related { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .related a { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 600; }
    .related a:hover { border-color: var(--accent); color: var(--accent); }
    .related a span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
    details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    summary { cursor: pointer; font-weight: 600; font-size: 15px; }
    details p { margin-top: 8px; color: #475569; }
    footer { margin: 30px 0 24px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; text-align: center; }
    @media (max-width: 640px) { .history { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { h1 { font-size: 21px; } .brand-mini span { display: none; } }
    @media (max-width: 480px) { h1 { font-size: 20px; } button { min-height: 44px; } }



    /* ===================== /embed/ shell overrides ===================== */
    html, body { margin: 0; padding: 0; }
    body.embed { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    .embed-main { flex: 1 1 auto; padding: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
               overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .embed-foot { flex: 0 0 auto; padding: 8px 12px 12px; text-align: center;
                  font-size: 12px; line-height: 1.4; color: var(--muted);
                  border-top: 1px solid var(--border); background: var(--card); }
    .embed-foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .embed-foot a:hover { text-decoration: underline; }
    .embed-foot .by { margin: 0 5px; }
</style>
</head>
<body class="embed">
<main class="embed-main">
<h1 class="sr-only">Yes No Wheel — free embeddable decision spinner</h1>
<div class="tool">
        <div class="wheel-wrap">
          <canvas id="wheel" width="440" height="440" role="img" aria-label="Spinning wheel"></canvas>
        </div>
        <div class="btns">
          <button type="button" class="icon-btn" id="muteBtn" onclick="toggleMute()" aria-label="Toggle sound" title="Sound on/off">🔊</button><button type="button" class="primary" onclick="buildAndSpin()">Spin</button>
          <button type="button" onclick="removeWinner()">Remove Winner</button>
          <button type="button" onclick="resetAll()">Reset</button>
        </div>
        <div class="result" id="result" aria-live="polite">Spin to answer yes or no</div>
        <div class="history" id="history" aria-live="polite"></div>
        <div class="meta" id="meta"></div>
        <p class="meta">Separate options with commas.</p>
        <input type="text" id="options" aria-label="Wheel options" value="Yes,No,Maybe,Try later">
      </div>
</main>
<footer class="embed-foot">
  <a href="https://myspinpick.com/yes-no-wheel/" target="_blank" rel="noopener">Yes No Wheel</a>
  <span class="by">by</span>
  <a href="https://myspinpick.com/" target="_blank" rel="noopener">MySpinPick</a>
</footer>

    <!-- /embed/ 专用埋点：把「父页面域名」记下来，才能知道谁真的嵌了我们 -->
    <script>
      (function () {
        var host = 'direct';
        try { host = document.referrer ? new URL(document.referrer).hostname : 'direct'; } catch (e) { host = 'direct'; }
        /* 自己域（直接打开嵌入页）与本地预览不算「被第三方嵌入」，否则会污染这份名单 */
        if (!host || host === 'myspinpick.com' || host === 'www.myspinpick.com' ||
            /^(localhost|127\..*|0\.0\.0\.0$|10\..*|192\.168\..*)/.test(host)) {
          host = 'direct';
        }
        if (typeof gtag === 'function') {
          gtag('event', 'embed_view', { embed_tool: 'yes-no-wheel', parent_host: host });
        }
      })();
    </script>
<script>var canvas = document.getElementById('wheel');
    var ctx = canvas.getContext('2d');
    var colors = ['#db2777','#7c3aed','#2563eb','#059669','#d97706','#dc2626','#0891b2','#65a30d'];
    var RESULT_PREFIX = "Answer: ";
    var RESULT_INIT = "Spin to answer yes or no";
    var options = [];
    var currentAngle = 0;
    var spinning = false;
    var historyCount = 0;

    function addHistory(name, colorIdx) {
      historyCount++;
      var chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.background = colors[colorIdx % colors.length];
      chip.title = name;
      chip.textContent = historyCount + '. ' + name;
      document.getElementById('history').appendChild(chip);
    }

    function getOptions() {
      var raw = document.getElementById('options').value;
      return raw.split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    }

    function drawWheel(angle) {
      var n = options.length;
      var cw = canvas.width, ch = canvas.height;
      var cx = cw / 2, cy = ch / 2, r = Math.min(cx, cy) - 12;
      ctx.clearRect(0, 0, cw, ch);
      if (n === 0) {
        ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#64748b'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Add options to spin', cx, cy);
        return;
      }
      var slice = (Math.PI * 2) / n;
      for (var i = 0; i < n; i++) {
        var start = angle + i * slice;
        var end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        var label = options[i];
        if (label.length > 14) label = label.slice(0, 13) + '…';
        ctx.fillText(label, r - 14, 5);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.moveTo(cx + r + 4, cy);
      ctx.lineTo(cx + r - 18, cy - 12);
      ctx.lineTo(cx + r - 18, cy + 12);
      ctx.closePath();
      ctx.fillStyle = '#1a202c';
      ctx.fill();
    }

    function pickWinner() {
      var n = options.length;
      var slice = (Math.PI * 2) / n;
      var a = ((currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      var idx = Math.floor(((Math.PI * 2 - a) % (Math.PI * 2)) / slice) % n;
      return idx;
    }

    function animate(total, duration) {
      if (!spinning) return;
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        var angle = currentAngle + total * eased;
        drawWheel(angle);
        var _n = options.length;
        if (_n > 0) {
          var _slice = (Math.PI * 2) / _n;
          var _a = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          var _idx = Math.floor(((Math.PI * 2 - _a) % (Math.PI * 2)) / _slice) % _n;
          if (_idx !== lastTickIdx) { lastTickIdx = _idx; tick(); }
        }
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          currentAngle = (currentAngle + total) % (Math.PI * 2);
          var idx = pickWinner();
          document.getElementById('result').textContent = RESULT_PREFIX + options[idx];
          addHistory(options[idx], idx);
          document.getElementById('meta').textContent = options.length + ' options on the wheel.';
          spinning = false;
          setBtnsDisabled(false);
          track('spin', { options: options.length, winner: options[idx] });
        }
      }
      requestAnimationFrame(step);
    }

    function buildAndSpin() {
      lastTickIdx = -1; ensureAudio();
      options = getOptions();
      if (options.length === 0) { document.getElementById('meta').textContent = 'Please add at least one option.'; return; }
      if (spinning) return;
      spinning = true;
      setBtnsDisabled(true);
      document.getElementById('result').textContent = 'Spinning…';
      drawWheel(currentAngle);
      var spins = 5 + Math.floor(Math.random() * 3);
      var total = spins * Math.PI * 2 + Math.random() * Math.PI * 2;
      animate(total, 3000);
    }

    function removeWinner() {
      var idx = pickWinner();
      if (options.length > 0) {
        var removed = options.splice(idx, 1);
        document.getElementById('options').value = options.join('\n');
        document.getElementById('result').textContent = 'Removed: ' + removed[0];
        drawWheel(currentAngle);
        document.getElementById('meta').textContent = options.length + ' options left.';
      }
    }

    /* ---------- sound (5.3) ---------- */
    var audioCtx = null, muted = false, lastTickIdx = -1;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function tick() {
      if (muted) return;
      var ac = ensureAudio();
      if (!ac) return;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = 740;
      g.gain.setValueAtTime(0.05, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.05);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.06);
    }
    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem('myspinpick.wheel.sound', muted ? 'off' : 'on'); } catch (e) {}
      var b = document.getElementById('muteBtn');
      if (b) b.textContent = muted ? '🔇' : '🔊';
    }
    function initSound() {
      try { muted = localStorage.getItem('myspinpick.wheel.sound') === 'off'; } catch (e) {}
      var b = document.getElementById('muteBtn');
      if (b) b.textContent = muted ? '🔇' : '🔊';
    }

    function setBtnsDisabled(d) { var b = document.querySelectorAll('.btns button'); for (var i = 0; i < b.length; i++) { b[i].disabled = d; } }

    function resetAll() {
      document.getElementById('options').value = 'Yes,No,Maybe,Try later';
      options = getOptions();
      currentAngle = 0;
      spinning = false;
      setBtnsDisabled(false);
      document.getElementById('result').textContent = RESULT_INIT;
      document.getElementById('meta').textContent = options.length + ' options on the wheel.';
      document.getElementById('history').innerHTML = '';
      historyCount = 0;
      drawWheel(0);
    }

    document.getElementById('options').addEventListener('input', function() {
      options = getOptions();
      drawWheel(currentAngle);
    });

    options = getOptions();
    if (options.length) { document.getElementById('meta').textContent = options.length + ' options on the wheel.'; }
    drawWheel(0);
  initSound();</script>
</body>
</html>
