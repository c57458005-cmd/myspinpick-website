<script>
  /* CSPRNG helper: crypto-secure uniform [0,1). Drop-in for Math.random().
     Uses the Web Crypto API (crypto.getRandomValues) so every spin, draw and
     shuffle on this page is backed by a cryptographically secure random source.
     Falls back to Math.random() only if Web Crypto is unavailable. */
  function cryptoRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] / 4294967296; /* 2^32 -> uniform [0,1) */
    }
    return Math.random();
  }
</script>

<style>

    .wheel-wrap { text-align: center; margin-bottom: 12px; }

    /* ===== 中心 Spin 按钮：SVG 一体成形（圆盘+指针同一条轮廓，无拼缝） ===== */
    #centerSpin { position: absolute; left: calc(50% - 50px); top: calc(50% - 62px);
      width: 100px; height: 112px; min-height: 0; padding: 0; border: 0; background: transparent;
      color: #fff; font-size: 17px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(15,23,42,.35);
      cursor: pointer; filter: drop-shadow(0 4px 10px rgba(190,24,93,.38));
      transition: transform .12s ease, filter .12s ease; transform-origin: 50% 62px; }
    #centerSpin:hover:not(:disabled) { transform: scale(1.05); }
    #centerSpin:active:not(:disabled) { transform: scale(.97); }
    #centerSpin svg { display: block; width: 100%; height: 100%; pointer-events: none; }
    #centerSpin .spin-txt { position: absolute; left: 0; top: 62px; width: 100%; transform: translateY(-50%); }

    /* 尺寸随轮盘直径等比；80px 下限保证手机端文字不小于 13px */
    #centerSpin {
      --s: max(80px, calc(var(--wheel, 440px) * 0.2));
      width: var(--s);
      height: calc(var(--s) * 1.12);
      left: calc(50% - var(--s) / 2);
      top: calc(50% - var(--s) * 0.62);
      font-size: max(13px, calc(var(--s) * 0.17));
      transform-origin: 50% calc(var(--s) * 0.62);
      outline: none;
    }
    #centerSpin .spin-txt { top: calc(var(--s) * 0.62); }
    /* 焦点环：指针尖在圆心上方 .59s 处，环半径取 .63s 才不会穿过指针 */
    #centerSpin::after {
      content: ""; position: absolute; left: 50%; top: calc(var(--s) * 0.62);
      width: calc(var(--s) * 1.26); height: calc(var(--s) * 1.26);
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; opacity: 0;
      box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--accent-dark);
      transition: opacity .12s ease;

  </style>
</head>

    function drawWheel(angle) {
      var n = options.length;
      var cw = VIEW, ch = VIEW;
      var cx = cw / 2, cy = ch / 2, r = Math.min(cx, cy) - 24; var rr = r - 7.5;
      ctx.clearRect(0, 0, cw, ch);
      if (n === 0) {
        ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#64748b'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Add options to spin', cx, cy);
        return;
      }
      var slice = (Math.PI * 2) / n;
      var SEG = curS().seg, LBL = curS().label;
      for (var i = 0; i < n; i++) {
        var start = angle + i * slice;
        var end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, rr, start, end);
        ctx.closePath();
        ctx.fillStyle = (typeof window.__segColor === 'function') ? window.__segColor(i, SEG) : SEG[i % SEG.length];
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = (typeof window.__lblColor === 'function') ? window.__lblColor(i, LBL) : LBL;
        ctx.font = 'bold 14px sans-serif';
        var label = options[i];
        if (label.length> 14) label = label.slice(0, 13) + '…';
        ctx.fillText(label, rr - 14, 5);
        ctx.restore();
      }
      if (winnerIdx !== null && winnerIdx < n) {
        var wStart = angle + winnerIdx * slice;
        var wEnd = wStart + slice;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, wStart, wEnd);
        var g = ctx.createLinearGradient(cx + Math.cos(wStart) * rr, cy + Math.sin(wStart) * rr, cx + Math.cos(wEnd) * rr, cy + Math.sin(wEnd) * rr);

        for (var gi = 0; gi < rimN; gi++) {
          var gstop = gi / rimN;
          ringGrad.addColorStop(gstop, RIMC[gi]);
          hubGrad.addColorStop(gstop, RIMC[gi]);

      ctx.arc(cx, cy, r, 0, T);
      ctx.strokeStyle = ringGrad || RIMF;
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 24, 0, T);
      ctx.fillStyle = hubGrad || RIMF;

      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, T);

    }

      var slice = (Math.PI * 2) / n;

      var idx = Math.floor((((Math.PI * 1.5 - a) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / slice) % n;

    function setBtnsDisabled(d) { var b = document.querySelectorAll('.btns button'); for (var i = 0; i < b.length; i++) { b[i].disabled = d; } if (centerSpin) centerSpin.disabled = d; }

    /* ===== v3：轮盘样式切换 ===== */
    function renderStyleChips() {
      var row = document.getElementById('styleRow');
      if (!row) return;
      var chips = row.querySelectorAll('.style-swatch');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.toggle('active', chips[i].getAttribute('data-style') === curStyle);
      }
    }


    /* 画布：与主页面同一条缩放链（VIEW 逻辑坐标 + DPR 物理像素） */
    function fitCanvas() {
      var box = canvas.parentElement;              /* .wheel-box */
      var host = box.parentElement;                /* .wheel-wrap */
      /* 与主页面同上限（主页面 panel 内实测 500，上限 520） */
      var avail = Math.min(520, host.clientWidth || 520);
      avail = Math.max(avail, 220);
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      canvas.style.width = avail + 'px';
      canvas.style.height = avail + 'px';
      box.style.setProperty('--wheel', avail + 'px');
      canvas.width = Math.round(avail * DPR);
      canvas.height = Math.round(avail * DPR);
      ctx.setTransform((avail * DPR) / VIEW, 0, 0, (avail * DPR) / VIEW, 0, 0);
    }

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tick() {
      if (muted) return;
      var ac = ensureAudio();
      if (!ac) return;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = 740;
      g.gain.setValueAtTime(0.05, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.05);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.06);
    }

    function ding() {
      if (muted) return;
      var ac = ensureAudio();
      if (!ac) return;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(988, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(1976, ac.currentTime + 0.09);
      g.gain.setValueAtTime(0.28, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.7);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.75);
    }

    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem(SOUND_KEY, muted ? 'off' : 'on'); } catch (e) {}
      document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    }

    /* ---------- saved lists ---------- */
    function itemsOf(text) {
      return String(text).split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    }
    function keyOf(text) {
      return itemsOf(text).map(function(s){ return s.toLowerCase(); }).sort().join('|');
    }
    function loadSaved() {
      try {
        var s = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
        if (Array.isArray(s)) {
          savedLists = s.filter(function(x){ return x && typeof x.text === 'string'; }).slice(0, SAVED_MAX);
          for (var i = 0; i < savedLists.length; i++) {
            if (!Array.isArray(savedLists[i].res)) savedLists[i].res = [];
          }
        }
      } catch (e) { savedLists = []; }
      if (savedLists.length) { applySavedRow(0); } else { renderSaved(); }
    }
    function persistSaved() {
      try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedLists)); } catch (e) {}
    }
    function saveList(silent, autoSelect) {
      var items = itemsOf(optionsEl.value);
      var meta = document.getElementById('meta');
      if (!items.length) { if (!silent) meta.textContent = 'Nothing to save — the options box is empty.'; return; }
      if (selectedSaved>= 0 && selectedSaved < savedLists.length) {
        savedLists[selectedSaved] = { text: items.join(','), n: items.length, res: savedLists[selectedSaved].res || [] };
        renderSaved();
        persistSaved();
        if (!silent) { meta.textContent = 'Saved list updated.'; track('save_list', { mode: 'update' }); }
        return;
      }
      var k = keyOf(optionsEl.value);
      for (var i = 0; i < savedLists.length; i++) {
        if (keyOf(savedLists[i].text) === k) {
          if (!silent || autoSelect) { selectedSaved = i; renderSaved(); }
          return;
        }
      }
      savedLists.unshift({ text: items.join(','), n: items.length, res: [] });
      if (savedLists.length> SAVED_MAX) savedLists.pop();
      if (!silent || autoSelect) selectedSaved = 0;
      renderSaved();
      persistSaved();
      if (!silent) track('save_list', { mode: 'new' });
    }
    function renderSaved() {
      var box = document.getElementById('savedLists');
      box.innerHTML = '';
      for (var i = 0; i < savedLists.length; i++) {
        (function(idx) {
          var row = document.createElement('div');
          row.className = 'saved-row' + (idx === selectedSaved ? ' selected' : '');
          row.setAttribute('role', 'button');
          row.setAttribute('tabindex', '0');
          row.addEventListener('click', function(e) {
            if (e.target.closest && e.target.closest('button')) return;
            selectSaved(idx);
          });
          row.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSaved(idx); }
          });
          var preview = document.createElement('span');
          preview.className = 'preview';
          preview.title = savedLists[idx].text;
          preview.textContent = savedLists[idx].text;
          var n = document.createElement('span');
          n.className = 'n';
          n.textContent = savedLists[idx].n + ' items';
          var del = document.createElement('button');
          del.type = 'button';
          del.textContent = '✕';
          del.setAttribute('aria-label', 'Delete this saved list');
          del.title = 'Delete this saved list';
          del.addEventListener('click', function() { deleteSaved(idx); });
          row.appendChild(preview);
          row.appendChild(n);
          row.appendChild(del);
          box.appendChild(row);
        })(i);
      }
    }
    function applySavedRow(idx) {
      optionsEl.value = savedLists[idx].text;
      options = getOptions();
      winnerIdx = null;
      selectedSaved = idx;
      drawWheel(currentAngle);
      autoGrow();
      var res = savedLists[idx].res || [];
      document.getElementById('result').textContent = res.length ? RESULT_PREFIX + res[res.length - 1].n : RESULT_INIT;
      renderHistoryFor(idx);
      document.getElementById('meta').textContent = options.length + ' options on the wheel.';
      renderSaved();
    }
    function selectSaved(idx) {
      if (spinning) { renderSaved(); return; }
      if (idx === selectedSaved) return;
      if (optionsEl.value.trim()) saveList(true);
      applySavedRow(idx);
    }
    function deleteSaved(idx) {
      savedLists.splice(idx, 1);
      if (selectedSaved === idx) {
        selectedSaved = -1;
        document.getElementById('result').textContent = RESULT_INIT;
        renderHistoryFor(-1);
      }
      else if (selectedSaved> idx) selectedSaved--;
      renderSaved();
      persistSaved();
    }
    function autoGrow() {
      optionsEl.style.height = 'auto';
      optionsEl.style.height = Math.max(46, optionsEl.scrollHeight) + 'px';
    }

    function reduceMotion() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
    }

    function showWinner(name) {
      /* v3.7：Winner popup 开关已移除，弹窗恒开 */
      if (!winModal) return;
      var nameEl = document.getElementById('winName');
      if (nameEl) nameEl.textContent = name;
      winModal.hidden = false;
      confettiBurst(130);
      var again = document.getElementById('winAgain');
      if (again) { try { again.focus({ preventScroll: true }); } catch (e) { again.focus(); } }
    }

    function hideWinner() {
      if (!winModal || winModal.hidden) return;
      winModal.hidden = true;
      confParts = [];
      if (confCtx) confCtx.clearRect(0, 0, confCanvas.clientWidth || 0, confCanvas.clientHeight || 0);
    }

    function confettiBurst(count) {
      if (!confCtx || reduceMotion()) return;
      var w = confCanvas.clientWidth || window.innerWidth;
      var h = confCanvas.clientHeight || window.innerHeight;
      var d = Math.min(window.devicePixelRatio || 1, 2);
      confCanvas.width = Math.round(w * d);
      confCanvas.height = Math.round(h * d);
      confCtx.setTransform(d, 0, 0, d, 0, 0);
      confParts = [];
      for (var i = 0; i < count; i++) {
        confParts.push({
          x: w / 2 + (cryptoRandom() - .5) * w * .55,
          y: h * .42 + (cryptoRandom() - .5) * 40,
          vx: (cryptoRandom() - .5) * 11,
          vy: -(3 + cryptoRandom() * 7),
          g: .28 + cryptoRandom() * .12,
          s: 5 + cryptoRandom() * 7,
          rot: cryptoRandom() * 6.2832,
          vr: (cryptoRandom() - .5) * .3,
          c: colors[Math.floor(cryptoRandom() * colors.length)],
          round: cryptoRandom() < .28
        });
      }
      confEnd = performance.now() + 2600;
      if (!confRAF) confRAF = requestAnimationFrame(confStep);
    }

    function confStep(ts) {
      if (!confCtx) { confRAF = 0; return; }
      var w = confCanvas.clientWidth, h = confCanvas.clientHeight;
      confCtx.clearRect(0, 0, w, h);
      for (var i = confParts.length - 1; i >= 0; i--) {
        var p = confParts[i];
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= .995;
        if (p.y > h + 40) { confParts.splice(i, 1); continue; }
        confCtx.save();
        confCtx.translate(p.x, p.y);
        confCtx.rotate(p.rot);
        confCtx.fillStyle = p.c;
        if (p.round) { confCtx.beginPath(); confCtx.arc(0, 0, p.s * .5, 0, 6.2832); confCtx.fill(); }
        else { confCtx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
        confCtx.restore();
      }
      if (confParts.length && ts < confEnd) confRAF = requestAnimationFrame(confStep);
      else { confCtx.clearRect(0, 0, w, h); confRAF = 0; }
    }


    function animate(total, duration) {
      if (!spinning) return;
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        var angle = currentAngle + total * eased;
        drawWheel(angle);
        var n = options.length;
        if (n> 0) {
          var slice = (Math.PI * 2) / n;
          var a = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          var idx = Math.floor((((Math.PI * 1.5 - a) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / slice) % n;
          if (idx !== lastTickIdx) { lastTickIdx = idx; tick(); }
        }
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          currentAngle = (currentAngle + total) % (Math.PI * 2);
          var idx = pickWinner();
          winnerIdx = idx;
          lastWinnerText = options[idx] || null;
          drawWheel(currentAngle);
          document.getElementById('result').textContent = RESULT_PREFIX + options[idx];
          recordResult(options[idx], idx);
          ding();
          spinning = false;
          setBtnsDisabled(false);
          showWinner(options[idx]);
          track('spin', { options: options.length, winner: options[idx] });
        }
      }
      requestAnimationFrame(step);
    }


    function buildAndSpin() {
      options = getOptions();
      if (options.length === 0) { document.getElementById('meta').textContent = 'Please add at least one option.'; return; }
      if (spinning) return;
      hideWinner();
      saveList(true, true);
      spinning = true;
      winnerIdx = null;
      setBtnsDisabled(true);
      document.getElementById('result').textContent = 'Spinning…';
      drawWheel(currentAngle);
      var spins = 5 + Math.floor(cryptoRandom() * 3);
      var total = spins * Math.PI * 2 + cryptoRandom() * Math.PI * 2;
      lastTickIdx = -1;
      ensureAudio();
      animate(total, 3000);
    }


    function removeWinner() {
      if (spinning) return;
      var list = getOptions();
      if (!list.length) return;
      var target = -1;
      if (lastWinnerText !== null) target = list.indexOf(lastWinnerText);
      if (target < 0 && winnerIdx !== null && winnerIdx >= 0 && winnerIdx < list.length) target = winnerIdx;
      var removed = (target >= 0) ? list.splice(target, 1)[0] : list.pop();
      optionsEl.value = list.join(',');
      options = getOptions();
      winnerIdx = null;
      lastWinnerText = null;
      drawWheel(currentAngle);
      document.getElementById('meta').textContent = removed
        ? ((target >= 0 ? 'Removed winner \u201c' : 'Removed \u201c') + removed + '\u201d. ' + list.length + ' options left.')
        : list.length + ' options left.';
      autoGrow();
    }

    function removeLast() {
      if (spinning) return;
      var list = getOptions();
      if (!list.length) return;
      list.pop();
      optionsEl.value = list.join(',');
      options = getOptions();
      winnerIdx = null;
      drawWheel(currentAngle);
      document.getElementById('meta').textContent = options.length + ' options left.';
      autoGrow();
    }

    function clearOptions() {
      if (spinning) return;
      optionsEl.value = '';
      options = [];
      winnerIdx = null;
      selectedSaved = -1;
      renderSaved();
      renderHistoryFor(-1);
      drawWheel(currentAngle);
      document.getElementById('result').textContent = RESULT_INIT;
      document.getElementById('meta').textContent = 'Options cleared.';
      autoGrow();
    }

    function resetAll() {
      winnerIdx = null;
      spinning = false;
      setBtnsDisabled(false);
      if (selectedSaved>= 0 && selectedSaved < savedLists.length) {
        savedLists[selectedSaved].res = [];
        persistSaved();
      }
      document.getElementById('result').textContent = RESULT_INIT;
      renderHistoryFor(selectedSaved);
      drawWheel(currentAngle);
      document.getElementById('meta').textContent = options.length + ' options on the wheel.';
    }


    /* ================== 交互绑定 ================== */
    if (centerSpin) centerSpin.addEventListener('click', buildAndSpin);

    optionsEl.addEventListener('input', function () {
      options = getOptions();
      winnerIdx = null;
      drawWheel(currentAngle);
      autoGrow();
    });

    if (winModal) {
      var winClose = document.getElementById('winClose');
      var winAgain = document.getElementById('winAgain');
      var winRemoveSpin = document.getElementById('winRemoveSpin');
      if (winClose) winClose.addEventListener('click', hideWinner);
      if (winAgain) winAgain.addEventListener('click', function () { hideWinner(); buildAndSpin(); });
      if (winRemoveSpin) winRemoveSpin.addEventListener('click', function () {
        hideWinner(); removeWinner(); buildAndSpin();
      });
      winModal.addEventListener('click', function (e) { if (e.target === winModal) hideWinner(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !winModal.hidden) hideWinner();
      });
    }

    /* 空格 = 转（与主页面一致），输入框里不抢键 */
    document.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' && e.key !== ' ') return;
      var t = e.target;
      if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
      if (winModal && !winModal.hidden) return;
      e.preventDefault();
      buildAndSpin();
    });

    var rsTimer = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rsTimer);
      rsTimer = setTimeout(function () { fitCanvas(); drawWheel(currentAngle); }, 120);
    });

    try { muted = localStorage.getItem(SOUND_KEY) === 'off'; } catch (e) {}
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    fitCanvas();
    options = getOptions();
    if (options.length) document.getElementById('meta').textContent = options.length + ' options on the wheel.';
    drawWheel(0);
    autoGrow();
    loadSaved();
</script>
</body>
</html>
