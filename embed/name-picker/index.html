<script>
/* CSPRNG helper: crypto-secure uniform [0,1). Drop-in for Math.random().
     Uses the Web Crypto API (crypto.getRandomValues) so every spin, draw and
     shuffle on this page is backed by a cryptographically secure random source.
     Falls back to Math.random() only if Web Crypto is unavailable. */
  function cryptoRandom() {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] / 4294967296; /* 2^32 -> uniform [0,1) */
    }
    return Math.random();
  }
</script>

  <script>
(function() {
      var namesEl = document.getElementById('names');
      var metaEl = document.getElementById('meta');
      var historyEl = document.getElementById('history');
      var prizeEl = document.getElementById('prizeSlot');
      var pickBtn = document.getElementById('pick');
      var resetBtn = document.getElementById('reset');
      var copyBtn = document.getElementById('copyBtn');
      var saveBtn = document.getElementById('saveBtn');
      var clearBtn = document.getElementById('clearBtn');
      var removeBtn = document.getElementById('removeBtn');
      var savedBoxEl = document.getElementById('savedLists');
      var removeChk = document.getElementById('removeWinner');
      var rolling = false;

      /* ---------- saved lists (wheel-spinner engine pattern) ---------- */
      var SAVED_KEY = 'myspinpick.namePicker.savedLists';
      var SAVED_MAX = 20;
      var LAST_KEY = 'myspinpick.namePicker.last';
      var savedLists = [];
      var selectedSaved = -1;

      function itemsOf(text) {
        return String(text).split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean);
      }
      function keyOf(text) {
        return itemsOf(text).map(function(s){ return s.toLowerCase(); }).sort().join('|');
      }
      function loadSaved() {
        try {

          s.setProperty('--wx1', r(3, 8) + 'px');  s.setProperty('--wy1', r(-7, -3) + 'px'); s.setProperty('--wr1', r(3, 7) + 'deg');
          s.setProperty('--wx2', r(-8, -3) + 'px'); s.setProperty('--wy2', r(1, 5) + 'px');
          s.setProperty('--wx3', r(2, 6) + 'px');  s.setProperty('--wy3', r(3, 7) + 'px');  s.setProperty('--wr2', r(-7, -3) + 'deg');
        }
      }

      function runClaw() {
        if (rolling) return Promise.resolve();
        var p = pool();
        if (!p.length) {
          metaEl.textContent = parseNames().length
            ? 'All names have been picked in this round — press Reset to start a new round.'
            : 'Enter names below to start.';
          namesEl.focus();
          return Promise.resolve();
        }
        rolling = true;
        updateMeta();
        saveList(true, true);
        /* 不再「整柜震动 + 重新排序」：那一段对结果没有任何影响（中奖人是在之后才随机的），
           纯属假动作，而且会把用户正在看的娃娃全换掉、让抓取看起来是演的。
           现在直接从「当前这一柜」里挑一个抓手，钩爪落下去就抓。 */
        stopSway();                          /* 巡游结束，接管钩爪 */
        void clawEl.offsetWidth;             /* 先让去掉 .idle 后的过渡生效，落爪才有动画 */
        clawHeadEl.classList.remove('closed');
        setCable(20);
        prizeEl.textContent = '';
        prizeEl.classList.remove('win');

        var winner = p[Math.floor(cryptoRandom() * p.length)];
        var visIdx = [];
        for (var vi = 0; vi < 8; vi++) { if (shelf[vi]) visIdx.push(vi); }
        if (!visIdx.length) randomizeShelf();
        visIdx = [];
        for (var vi2 = 0; vi2 < 8; vi2++) { if (shelf[vi2]) visIdx.push(vi2); }
        var idx = shelf.indexOf(winner);
        if (idx < 0) idx = visIdx.length ? visIdx[Math.floor(cryptoRandom() * visIdx.length)] : 0;
        var toy = toyEls[idx];
        var targetX = toy.offsetLeft + toy.offsetWidth / 2;
        var needSwap = shelf[idx] !== winner;

        return wait(150).then(function() {
          tone(250, .28, 'sawtooth', .03);
          setClawX(targetX);
          return wait(520);
        }).then(function() {
          tone(320, .45, 'sine', .035);
          /* 钩爪正从娃娃上方落下，这一刻换名字基本看不见 —— 只动这一个娃娃 */
          if (needSwap) { shelf[idx] = winner; renderShelf(); }
          setCable(Math.max(26, toy.offsetTop - 13));
          return wait(560);
          }).then(function() {
            clawHeadEl.classList.add('closed');
            tone(920, .07, 'square', .05);
            return wait(320);
          }).then(function() {
            var wface = toy.querySelector('.face');
            gripEl.innerHTML = '<div class="toy fake"><span class="face">' + (wface ? wface.textContent : '\uD83E\uDDD8') + '</span></div>';
            if (toy) toy.style.display = 'none';
            return wait(140);
          }).then(function() {
            tone(420, .45, 'sine', .03);
            setCable(22);
            return wait(540);
          }).then(function() {
            tone(280, .5, 'sawtooth', .03);
            setClawX(holeEl.offsetLeft + holeEl.offsetWidth / 2);
            return wait(560);
          }).then(function() {
            clawHeadEl.classList.remove('closed');
            tone(700, .06, 'square', .045);
            var fake = gripEl.querySelector('.toy.fake');
            if (fake) fake.classList.add('dropping');
            return wait(420);
          }).then(function() {
            holeEl.classList.add('hit');
            setTimeout(function() { holeEl.classList.remove('hit'); }, 420);
            prizeEl.textContent = '🏆 ' + winner;
            prizeEl.classList.add('win');
            confetti();
            fanfare();
            recordResult(winner);
            track('pick_name', { method: 'claw_machine' });
            setTimeout(function() { gripEl.innerHTML = ''; }, 900);
            /* 被夹走的位置空出来，下次抽奖前补一个新名字（名单都抽完了就空着，
               正好呼应"全部抽完"的状态） */
            shelf[idx] = '';
            syncShelf();
            rolling = false;
            updateMeta();
            startSway();   /* 抓完后钩爪继续巡游 */
          });
      }

      pickBtn.addEventListener('click', function() {
        pickBtn.classList.remove('attn');   /* 用户已经会点了，提示动画立即撤掉 */
        runClaw();
      });

      function resetAll() {
        if (rolling) return;
        prizeEl.classList.remove('win');
        /* Reset = 清空这一名单的结果 + 结束本轮，下一抽重新从 Batch 1 开始 */
        if (selectedSaved >= 0 && selectedSaved < savedLists.length) {
          savedLists[selectedSaved].res = [];
          persistSaved();
        }
        startBatch();
        renderHistoryFor(selectedSaved);
        prizeEl.textContent = '';
        resetMachine();
        randomizeFaces();
        randomizeShelf();
        updateMeta();
      }
      resetBtn.addEventListener('click', resetAll);

      saveBtn.addEventListener('click', function() {
        var items = itemsOf(namesEl.value);
        if (!items.length) { metaEl.textContent = 'Nothing to save — the names box is empty.'; return; }
        var before = selectedSaved;
        saveList(false, true, true);
        metaEl.textContent = (selectedSaved === before && before >= 0) ? 'Saved list updated.' : 'List saved.';
      });
      clearBtn.addEventListener('click', clearOptions);
      removeBtn.addEventListener('click', removeLast);

      namesEl.addEventListener('paste', function(e) {
        e.preventDefault();
        var t = (e.clipboardData || window.clipboardData).getData('text') || '';
        t = t.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean).join(',');
        if (!t) return;
        var s = namesEl.selectionStart, epos = namesEl.selectionEnd;
        namesEl.value = namesEl.value.slice(0, s) + t + namesEl.value.slice(epos);
        namesEl.setSelectionRange(s + t.length, s + t.length);
        namesEl.dispatchEvent(new Event('input', { bubbles: true }));
      });
      namesEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var s = namesEl.selectionStart, epos = namesEl.selectionEnd;
          namesEl.value = namesEl.value.slice(0, s) + ',' + namesEl.value.slice(epos);
          namesEl.setSelectionRange(s + 1, s + 1);
          namesEl.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });
      /* 文本框高度自适应：随内容长高，超过窗口 40%（160–320px 之间）后改为内部滚动 */
      function taCap() {
        return Math.max(160, Math.min(320, Math.round(window.innerHeight * 0.4)));
      }
      function autoGrow() {
        var cap = taCap();
        namesEl.style.height = 'auto';
        var h = namesEl.scrollHeight;
        namesEl.style.height = Math.max(46, Math.min(h, cap)) + 'px';
        namesEl.style.overflowY = h > cap ? 'auto' : 'hidden';
      }
      window.addEventListener('resize', autoGrow);
      namesEl.addEventListener('input', function() {
        updateMeta();
        /* 打字时不要立刻重排货架（会让人眼花），停手 350ms 再对齐：
           只清掉已不存在的名字 + 补空位，不随机重排 */
        clearTimeout(shelfTimer);
        shelfTimer = setTimeout(syncShelf, 350);
        persistLast();
        autoGrow();
      });
      removeChk.addEventListener('change', function() {
        /* 开关「不重复」等于换一轮：池子按新规则重置，下一次抽取另开一张批次卡片 */
        if (removeChk.checked) startBatch();
        updateMeta();
        renderHistoryFor(selectedSaved);
        persistLast();
      });
      window.addEventListener('resize', function() {
        if (!rolling && !swayRAF) setClawX(cabinetEl.clientWidth / 2);
      });
      loadSaved();
      updateMeta();
      resetMachine();
      randomizeFaces();
      randomizeShelf();
      startSway();                                      /* 进页面钩爪就开始左右巡游 */
      /* 首次进入：Pick 闪动 3 秒提示可点。等 load 后再起算，
         否则图片加载慢时用户几乎看不到这段提示。 */
      function flashPick() {
        pickBtn.classList.add('attn');
        setTimeout(function() { pickBtn.classList.remove('attn'); }, 3100);
      }
      if (document.readyState === 'complete') { flashPick(); }
      else { window.addEventListener('load', flashPick); }

      copyBtn.addEventListener('click', copyResult);

      function copyResult() {
        var items = [];
        if (selectedSaved >= 0 && selectedSaved < savedLists.length && Array.isArray(savedLists[selectedSaved].res)) {
          var RB = savedLists[selectedSaved].res;
          for (var i = 0; i < RB.length; i++) {
            var pk = (RB[i] && RB[i].picks) || [];
            for (var k = 0; k < pk.length; k++) items.push(pk[k]);
          }
        }
        if (!items.length) {
          var chips = historyEl.querySelectorAll('.batch .chip');
          for (var j = 0; j < chips.length; j++) items.push(chips[j].textContent);
        }
        if (!items.length) { metaEl.textContent = 'Nothing to copy — pick a name first.'; return; }
        var text = items.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function(){ metaEl.textContent = 'Copied!'; track('copy', { tool: 'name-picker' }); }).catch(function(){ fallbackCopy(text); });
        } else { fallbackCopy(text); }
      }
      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); metaEl.textContent = 'Copied!'; track('copy'); }
        catch (e) { metaEl.textContent = 'Copy failed'; }
        document.body.removeChild(ta);
      }
    })();
  </script>
</body>
</html>
